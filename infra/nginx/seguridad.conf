# Cabeceras de seguridad. nginx solo hereda add_header de server si el location no define ninguno, así que
# cada location con su propio add_header incluye este archivo otra vez (si no, index.html salía sin CSP).
# Content Security Policy estricta (reglas/02-frontend-angular.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
