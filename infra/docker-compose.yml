# Entorno local: PostgreSQL 18 con los roles de producción, migraciones, API y web.
# Uso: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml up --build
name: aula-lista

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aula_lista
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CLAVE_POSTGRES:?Define CLAVE_POSTGRES en infra/.env}
      CLAVE_APP_MIGRACIONES: ${CLAVE_APP_MIGRACIONES:?Define CLAVE_APP_MIGRACIONES}
      CLAVE_APP_RUNTIME: ${CLAVE_APP_RUNTIME:?Define CLAVE_APP_RUNTIME}
    volumes:
      - datos:/var/lib/postgresql
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql.inc:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aula_lista"]
      interval: 5s
      retries: 10

  migraciones:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: ["--migrar"]
    environment:
      ConnectionStrings__Migraciones: Host=db;Database=aula_lista;Username=app_migraciones;Password=${CLAVE_APP_MIGRACIONES};GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AulaLista: Host=db;Database=aula_lista;Username=app_runtime;Password=${CLAVE_APP_RUNTIME};GSS Encryption Mode=Disable
      Jwt__ClaveFirma: ${JWT_CLAVE_FIRMA:?Define JWT_CLAVE_FIRMA}
    depends_on:
      migraciones:
        condition: service_completed_successfully
    ports:
      - "5080:8080"

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  datos:
