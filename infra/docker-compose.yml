# Entorno local: PostgreSQL 18 con los roles de producción, migraciones, API y web.
# Uso: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml up --build
name: aula-lista

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aula_lista
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CLAVE_POSTGRES:?Define CLAVE_POSTGRES en infra/.env}
      CLAVE_APP_MIGRACIONES: ${CLAVE_APP_MIGRACIONES:?Define CLAVE_APP_MIGRACIONES}
      CLAVE_APP_RUNTIME: ${CLAVE_APP_RUNTIME:?Define CLAVE_APP_RUNTIME}
    volumes:
      - datos:/var/lib/postgresql
      - ./postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql.inc:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aula_lista"]
      interval: 5s
      retries: 10

  migraciones:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: ["--migrar"]
    environment:
      ConnectionStrings__Migraciones: Host=db;Database=aula_lista;Username=app_migraciones;Password=${CLAVE_APP_MIGRACIONES};GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AulaLista: Host=db;Database=aula_lista;Username=app_runtime;Password=${CLAVE_APP_RUNTIME};GSS Encryption Mode=Disable
      Jwt__ClaveFirma: ${JWT_CLAVE_FIRMA:?Define JWT_CLAVE_FIRMA}
      Cuentas__UrlWeb: ${URL_WEB:-http://localhost:8080}
      Ia__Proveedor: ${IA_PROVEEDOR:-simulado}
      Ia__Modelo: ${IA_MODELO:-claude-haiku-5-5}
      Ia__ApiKey: ${IA_API_KEY:-}
      Push__Proveedor: ${PUSH_PROVEEDOR:-simulado}
      Push__ClavePublica: ${PUSH_CLAVE_PUBLICA:-}
      Push__ClavePrivada: ${PUSH_CLAVE_PRIVADA:-}
      Whatsapp__Proveedor: ${WHATSAPP_PROVEEDOR:-simulado}
      Whatsapp__Token: ${WHATSAPP_TOKEN:-}
      Whatsapp__IdNumero: ${WHATSAPP_ID_NUMERO:-}
      Whatsapp__SecretoApp: ${WHATSAPP_SECRETO_APP:-}
      Whatsapp__TokenVerificacion: ${WHATSAPP_TOKEN_VERIFICACION:-}
      Pagos__Proveedor: ${PAGOS_PROVEEDOR:-simulado}
      Pagos__ClaveSecreta: ${STRIPE_CLAVE_SECRETA:-}
      Pagos__SecretoWebhook: ${STRIPE_SECRETO_WEBHOOK:-}
      Pagos__PrecioPrimerGrupoId: ${STRIPE_PRECIO_PRIMER_GRUPO:-}
      Pagos__PrecioGrupoAdicionalId: ${STRIPE_PRECIO_GRUPO_ADICIONAL:-}
      Planes__OxxoHabilitado: ${OXXO_HABILITADO:-true}
      Correo__Proveedor: ${CORREO_PROVEEDOR:-buzon}
      Correo__BrevoApiKey: ${BREVO_API_KEY:-}
      Correo__Remitente: ${CORREO_REMITENTE:-no-responder@aulalista.mx}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Almacen__Ruta: /var/lib/aula-lista/archivos
      Trabajos__Servidor: ${TRABAJOS_SERVIDOR:-true}
      # Grafana Cloud (SPEC-09, ADR-0015). Vacías: no se manda nada.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${ENTORNO:-local}
      # RNF-004: 5 por minuto. Las pruebas end-to-end lo suben porque todas entran desde la misma IP.
      Cuentas__IntentosInicioSesionPorMinuto: ${INTENTOS_INICIO_SESION:-5}
    volumes:
      # Exportaciones de datos (24 h). En Azure se cambia por almacenamiento de objetos (ADR-0013).
      - archivos:/var/lib/aula-lista/archivos
    depends_on:
      migraciones:
        condition: service_completed_successfully
    ports:
      - "5080:8080"

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Grafana Faro (ADR-0015). Vacía: la web no lo carga.
      FARO_URL: ${FARO_URL:-}
      FARO_ENTORNO: ${ENTORNO:-local}
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  datos:
  archivos:
