# Producción (beta con docentes reales) en el VPS de Oracle, junto a staging y otras apps que usan Caddy en 80/443
# (ADR-0020). Pasos completos en docs/operacion/produccion-oracle.md.
# Uso, desde esta carpeta: docker compose --env-file .env up -d
# Todo es real: los proveedores no tienen valor por omisión y faltar uno detiene el arranque.
name: aulisima-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aulisima
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CLAVE_POSTGRES:?Define CLAVE_POSTGRES en .env}
      CLAVE_APP_MIGRACIONES: ${CLAVE_APP_MIGRACIONES:?Define CLAVE_APP_MIGRACIONES en .env}
      CLAVE_APP_RUNTIME: ${CLAVE_APP_RUNTIME:?Define CLAVE_APP_RUNTIME en .env}
    volumes:
      - datos:/var/lib/postgresql
      - ../postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ../postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql.inc:ro
    # Sin puertos publicados: solo la API la ve, por la red interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aulisima"]
      interval: 5s
      retries: 10

  migraciones:
    image: ghcr.io/salcidoprc/aula-lista-api:${VERSION:?Define VERSION en .env con el commit probado en staging}
    command: ["--migrar"]
    environment:
      ConnectionStrings__Migraciones: Host=db;Database=aulisima;Username=app_migraciones;Password=${CLAVE_APP_MIGRACIONES};GSS Encryption Mode=Disable
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ghcr.io/salcidoprc/aula-lista-api:${VERSION:?Define VERSION en .env con el commit probado en staging}
    restart: unless-stopped
    environment:
      ConnectionStrings__Aulisima: Host=db;Database=aulisima;Username=app_runtime;Password=${CLAVE_APP_RUNTIME};GSS Encryption Mode=Disable
      # Caddy y luego nginx: la IP del usuario está dos saltos atrás en X-Forwarded-For (RNF-004).
      Proxies__Saltos: 2
      Jwt__ClaveFirma: ${JWT_CLAVE_FIRMA:?Define JWT_CLAVE_FIRMA en .env}
      Cuentas__UrlWeb: ${URL_WEB:?Define URL_WEB en .env}
      Ia__Proveedor: ${IA_PROVEEDOR:?Define IA_PROVEEDOR en .env}
      Ia__Modelo: ${IA_MODELO:-claude-haiku-5-5}
      Ia__ApiKey: ${IA_API_KEY:-}
      Push__Proveedor: ${PUSH_PROVEEDOR:?Define PUSH_PROVEEDOR en .env}
      Push__ClavePublica: ${PUSH_CLAVE_PUBLICA:-}
      Push__ClavePrivada: ${PUSH_CLAVE_PRIVADA:-}
      Whatsapp__Proveedor: ${WHATSAPP_PROVEEDOR:-simulado}
      Whatsapp__Token: ${WHATSAPP_TOKEN:-}
      Whatsapp__IdNumero: ${WHATSAPP_ID_NUMERO:-}
      Whatsapp__SecretoApp: ${WHATSAPP_SECRETO_APP:-}
      Whatsapp__TokenVerificacion: ${WHATSAPP_TOKEN_VERIFICACION:-}
      Pagos__Proveedor: ${PAGOS_PROVEEDOR:?Define PAGOS_PROVEEDOR en .env}
      Pagos__ClaveSecreta: ${STRIPE_CLAVE_SECRETA:-}
      Pagos__SecretoWebhook: ${STRIPE_SECRETO_WEBHOOK:-}
      Pagos__PrecioPrimerGrupoId: ${STRIPE_PRECIO_PRIMER_GRUPO:-}
      Pagos__PrecioGrupoAdicionalId: ${STRIPE_PRECIO_GRUPO_ADICIONAL:-}
      Planes__OxxoHabilitado: ${OXXO_HABILITADO:-true}
      Correo__Proveedor: ${CORREO_PROVEEDOR:?Define CORREO_PROVEEDOR en .env}
      Correo__BrevoApiKey: ${BREVO_API_KEY:-}
      Correo__Remitente: ${CORREO_REMITENTE:-no-responder@aulisima.com}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Almacen__Ruta: /var/lib/aulisima/archivos
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=produccion
    volumes:
      - archivos:/var/lib/aulisima/archivos
      # Llaves de Data Protection: sin volumen se pierden al recrear la API.
      - claves:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migraciones:
        condition: service_completed_successfully

  # Nombre distinto al de staging ("aulisima-web"): los dos comparten la red de Caddy.
  aulisima-prod-web:
    image: ghcr.io/salcidoprc/aula-lista-web:${VERSION:?Define VERSION en .env con el commit probado en staging}
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      FARO_URL: ${FARO_URL:-}
      FARO_ENTORNO: produccion
    depends_on:
      - api
    networks:
      - default
      - caddy

volumes:
  datos:
  archivos:
  claves:

networks:
  # Red del Caddy que ya atiende 80/443 en el servidor (docker network ls).
  caddy:
    external: true
    name: ${RED_CADDY:-deploy_default}
