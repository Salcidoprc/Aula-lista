name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: apps/api/global.json
      - name: Restaurar
        run: dotnet restore AulaLista.sln
      - name: Compilar (advertencias como errores)
        run: dotnet build AulaLista.sln --no-restore -c Release
      - name: Formato
        run: dotnet format AulaLista.sln --verify-no-changes --no-restore
      - name: Contrato OpenAPI al día
        run: git diff --exit-code -- openapi/
      - name: Pruebas unitarias, de arquitectura e integración (Testcontainers + RLS)
        run: dotnet test AulaLista.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: Paquetes vulnerables
        run: |
          dotnet list AulaLista.sln package --vulnerable --include-transitive | tee vulnerables.txt
          ! grep -q "has the following vulnerable packages" vulnerables.txt

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Cliente de la API generado del contrato
        run: npm run api:generar && git diff --exit-code -- src/app/api
      - run: npm run lint
      - name: Contraste AA de los temas claro y oscuro (RNF-027)
        run: npm run contraste:verificar
      - run: npm test
      - name: Build de producción con presupuestos
        run: npm run build
      - name: Bundle inicial comprimido (RNF-011)
        run: npm run bundle:verificar
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      CLAVE_POSTGRES: ci-postgres
      CLAVE_APP_MIGRACIONES: ci-migraciones
      CLAVE_APP_RUNTIME: ci-runtime
      JWT_CLAVE_FIRMA: clave-de-ci-con-al-menos-32-caracteres
      # Todas las pruebas entran desde la misma IP; el límite por IP se prueba en integración.
      INTENTOS_INICIO_SESION: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Levantar base, migraciones, API y web
        run: |
          docker compose -f infra/docker-compose.yml up --build -d
          for i in $(seq 1 60); do curl -sf http://localhost:8080/salud && exit 0; sleep 2; done
          docker compose -f infra/docker-compose.yml logs; exit 1
      - name: Instalar Playwright
        working-directory: apps/web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pruebas end-to-end (incluye movimiento reducido y accesibilidad)
        working-directory: apps/web
        run: npx playwright test
      - name: Bitácora de contenedores
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  imagenes:
    name: Imágenes Docker (amd64 + arm64)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [e2e]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        componente: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen en minúsculas
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.componente }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.componente }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
            ${{ steps.nombre.outputs.imagen }}:main
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}

  staging:
    name: Desplegar a staging (Coolify)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [imagenes]
    steps:
      - name: Avisar a Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_STAGING }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::warning::Falta el secreto COOLIFY_WEBHOOK_STAGING; staging no se desplegó."
            exit 0
          fi
          curl --fail -sS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
