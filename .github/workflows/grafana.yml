name: Configurar Grafana

# ADR-0015: aplica las alertas de SPEC-09 en Grafana Cloud. Se corre a mano (Actions → Configurar Grafana → Run workflow)
# después de cambiar infra/grafana/ o los destinatarios. Los valores viven en los secretos del repositorio.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aplicar:
    name: Alertas y avisos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Aplicar infra/grafana
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          ALERTA_CORREOS: ${{ secrets.ALERTA_CORREOS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: infra/grafana/aplicar.sh
